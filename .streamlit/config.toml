# The design system is Streamlit's own theme, set here, so every native
# widget (buttons, inputs, tables, tabs, alerts) is styled consistently by
# Streamlit rather than patched with CSS selectors. ui_theme.py only styles
# the few custom HTML pieces the app renders itself.
#
# Palette: warm paper, ink text, one accent (deep teal). Contrast on the
# paper background: text 15.5:1, muted text (#5F625E) 5.7:1, accent
# 5.6:1, white on the accent 6.1:1. All clear WCAG AA for body text.

[theme]
base = "light"
primaryColor = "#0F6E63"
backgroundColor = "#F6F5F1"
secondaryBackgroundColor = "#ECEAE3"
textColor = "#1B1D1C"
linkColor = "#0F6E63"
borderColor = "#DAD6CC"
dataframeBorderColor = "#E3DFD6"
dataframeHeaderBackgroundColor = "#EFEDE7"
codeBackgroundColor = "#EFEDE7"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
baseFontSize = 15
font = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap, sans-serif"
headingFont = "Geist:https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap, sans-serif"
codeFont = "'Geist Mono':https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..600&display=swap, monospace"
headingFontWeights = 600
metricValueFontWeight = 600

[client]
# The Deploy button and developer menu are noise for a reader.
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
