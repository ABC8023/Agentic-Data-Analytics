name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # numpy 2.5 needs Python 3.12 or newer, so 3.11 cannot install the
        # pinned requirements.
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Byte-compile every module
        run: python -m compileall -q .

      - name: Test
        # No API key is set on purpose. The whole deterministic product,
        # and every test, must work without one.
        env:
          GOOGLE_API_KEY: ""
          GEMINI_API_KEY: ""
        run: python -m unittest discover -s tests -t . -v

  # The Dockerfile is built and both entry points are started and probed,
  # so an image that builds but cannot serve fails here, not in a deploy.
  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --tag ai-data-analyst:ci .

      - name: The API answers a question
        run: |
          docker run --detach --name api --publish 8000:8000 \
            --env AI_ANALYST_API_KEYS=ci-smoke-key \
            --env AI_ANALYST_API_USE_MODEL=0 \
            ai-data-analyst:ci uvicorn api:app --host 0.0.0.0 --port 8000

          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:8000/healthz && break
            sleep 2
          done

          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://127.0.0.1:8000/v1/ask \
            -H 'Content-Type: application/json' \
            -d '{"dataset": "store_orders.csv", "question": "total revenue"}')
          test "$status" = "401" || { echo "expected 401 without a key, got $status"; exit 1; }

          curl --silent --fail -X POST http://127.0.0.1:8000/v1/ask \
            -H 'Authorization: Bearer ci-smoke-key' \
            -H 'Content-Type: application/json' \
            -d '{"dataset": "store_orders.csv", "question": "total revenue"}' \
            | tee answer.json
          grep -q '"answered":true' answer.json

      - name: The Streamlit app reports healthy
        run: |
          docker run --detach --name app --publish 8501:8501 ai-data-analyst:ci

          for attempt in $(seq 1 60); do
            curl --silent --fail http://127.0.0.1:8501/_stcore/health && exit 0
            sleep 2
          done

          docker logs app
          exit 1

      - name: The container runs as a non-root user
        run: test "$(docker run --rm ai-data-analyst:ci id -u)" != "0"

      - name: Logs on failure
        if: failure()
        run: |
          docker logs api || true
          docker logs app || true
