name: Evaluation

# The golden question set against the live model. Separate from CI because
# it needs a key and costs tokens. Offline scoring already runs in CI as
# part of the unit tests (tests/test_evaluation.py).
#
# Setup: add GOOGLE_API_KEY as a repository secret. Optionally set the
# repository variable EVAL_MODEL to a dated model name so runs can be
# compared; the default is a rolling alias and the report says so.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate (leave blank for EVAL_MODEL or the default)"
        required: false

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check for a key
        id: key
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "No GOOGLE_API_KEY secret, skipping the live run."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the golden set live
        if: steps.key.outputs.present == 'true'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          AI_ANALYST_MODEL: ${{ inputs.model || vars.EVAL_MODEL }}
        run: python tools/eval_planner.py --live --max-confident-wrong 0

      - name: Keep the report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: tools/results/eval-*.json
          retention-days: 30
